version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: valo-postgres
    environment:
      POSTGRES_USER: valo_user
      POSTGRES_PASSWORD: valo_password
      POSTGRES_DB: valo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valo_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: valo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: valo-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://valo_user:valo_password@postgres:5432/valo
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: development
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: valo-network
